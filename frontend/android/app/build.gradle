
apply plugin: 'com.android.application'

// Release signing secrets are read from the environment first, then from the
// gitignored local.properties. A missing value fails the build before any
// artifact is produced, so a wrongly-signed bundle can never reach Play.
def signingProperty(String key) {
    def props = new Properties()
    def propsFile = rootProject.file('local.properties')
    if (propsFile.exists()) {
        propsFile.withInputStream { props.load(it) }
    }
    return System.getenv(key) ?: props.getProperty(key)
}

def requiredSigningValue(String key, String fallbackKey = null) {
    def value = signingProperty(key) ?: (fallbackKey ? signingProperty(fallbackKey) : null)
    if (!value) {
        throw new GradleException(
            "Missing ${key}. Set it in frontend/android/local.properties (local) " +
            "or as a CI secret (release builds)."
        )
    }
    return value
}

android {
    namespace "com.kinjo.app"
    compileSdk rootProject.ext.compileSdkVersion
    defaultConfig {
        applicationId "com.kinjo.app"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode 15
        versionName "2.1.0"
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        aaptOptions {
             // Files and dirs to omit from the packaged assets dir, modified to accommodate modern web apps.
             // Default: https://android.googlesource.com/platform/frameworks/base/+/282e181b58cf72b6ca770dc7ca5f91f135444502/tools/aapt/AaptAssets.cpp#61
            ignoreAssetsPattern '!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~'
        }
    }
    signingConfigs {
        debug {
            storeFile file(System.getProperty('user.home') + '/.android/debug.keystore')
            storePassword 'android'
            keyAlias 'androiddebugkey'
            keyPassword 'android'
        }
        release {
            def keystorePath = System.getenv('KINJO_KEYSTORE_FILE') ?: 'kinjo-release-key.jks'
            def keystoreFile = file(keystorePath)
            if (keystoreFile.exists()) {
                // Secrets come from the environment (CI) or local.properties
                // (gitignored) — never from this file, which is tracked.
                storeFile keystoreFile
                storePassword requiredSigningValue('KINJO_KEYSTORE_PASSWORD')
                keyAlias System.getenv('KINJO_KEY_ALIAS') ?: signingProperty('KINJO_KEY_ALIAS') ?: 'kinjo-release-key'
                keyPassword requiredSigningValue('KINJO_KEY_PASSWORD', 'KINJO_KEYSTORE_PASSWORD')
            } else {
                logger.warn('Release signing keystore not found; release builds will fail')
            }
        }
    }
    buildTypes {
        debug {
            signingConfig signingConfigs.debug
        }
        release {
            signingConfig signingConfigs.release
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
        }
    }
}

repositories {
    flatDir{
        dirs 'libs'
    }
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
    implementation "androidx.coordinatorlayout:coordinatorlayout:$androidxCoordinatorLayoutVersion"
    implementation "androidx.core:core-splashscreen:$coreSplashScreenVersion"
    implementation project(':capacitor-android')
    // Firebase Cloud Messaging only. firebase-analytics was pulled in but never
    // called, and it drags ACCESS_ADSERVICES_AD_ID / AD_ID into the manifest,
    // which obliges a Play Data Safety declaration for the advertising ID.
    implementation platform('com.google.firebase:firebase-bom:34.19.0')
    implementation 'com.google.firebase:firebase-messaging'

    testImplementation "junit:junit:$junitVersion"
    androidTestImplementation "androidx.test.ext:junit:$androidxJunitVersion"
    androidTestImplementation "androidx.test.espresso:espresso-core:$androidxEspressoCoreVersion"
}

apply from: 'capacitor.build.gradle'

try {
    def servicesJSON = file('google-services.json')
    if (servicesJSON.exists()) {
        apply plugin: 'com.google.gms.google-services'
    }
} catch(Exception e) {
    logger.info("google-services.json not found, google-services plugin not applied. Push Notifications won't work")
}
