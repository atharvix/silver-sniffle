name: Build Android APK

# Builds the bundled Capacitor app in frontend/native, release-signed with the
# existing Kinjo key (same package + key = Play treats it as an update).
# No pull_request trigger: fork PRs can't read signing secrets.
on:
  push:
    branches: [main, master, slave]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '21' }
      - uses: actions/setup-node@v4
        with: { node-version: '22' }

      - name: Signing key and FCM config from secrets
        working-directory: frontend/native
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: |
          [ -n "$KEYSTORE_BASE64" ] || { echo "::error::ANDROID_KEYSTORE_BASE64 secret missing"; exit 1; }
          echo "$KEYSTORE_BASE64" | base64 --decode > kinjo-release-key.jks
          [ -z "$GOOGLE_SERVICES_JSON" ] || printf '%s' "$GOOGLE_SERVICES_JSON" > google-services.json

      - name: Android SDK
        working-directory: frontend/native
        run: bash android-build.sh sdk

      - name: Signed release APK + AAB
        working-directory: frontend/native
        env:
          API_BASE: https://kinjo.world
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS || 'kinjo-release-key' }}
        run: |
          bash android-build.sh app
          (cd android && ANDROID_HOME=$HOME/android-sdk ./gradlew bundleRelease --no-daemon -q)

      - uses: actions/upload-artifact@v4
        with:
          name: kinjo-android
          path: |
            frontend/native/android/app/build/outputs/apk/release/*.apk
            frontend/native/android/app/build/outputs/bundle/release/*.aab
          retention-days: 30
