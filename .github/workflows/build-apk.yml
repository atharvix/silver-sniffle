name: Build Android APK

on:
  push:
    branches: [ main, master, slave ]
  pull_request:
    branches: [ main, master, slave ]
  workflow_dispatch:

jobs:
  build-apk:
    name: Build Android APK & AAB
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Java JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platforms;android-36 build-tools;35.0.0'

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install Frontend Dependencies
        working-directory: ./frontend
        run: npm install

      - name: Build Web Assets (Production)
        working-directory: ./frontend
        run: npm run build

      - name: Sync Capacitor Android
        working-directory: ./frontend
        run: npx cap sync android

      - name: Make Gradlew Executable
        working-directory: ./frontend/android
        run: chmod +x gradlew

      - name: Decode Release Keystore
        if: ${{ secrets.ANDROID_KEYSTORE_BASE64 != '' }}
        run: |
          echo "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | base64 --decode > frontend/android/app/kinjo-release-key.jks

      - name: Build Android Release APK & AAB
        if: ${{ secrets.ANDROID_KEYSTORE_BASE64 != '' }}
        env:
          KINJO_KEYSTORE_FILE: kinjo-release-key.jks
          KINJO_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD || '0e84c9c9d585d7c4512983e4582cf6c3' }}
          KINJO_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS || 'kinjo-release-key' }}
          KINJO_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD || '0e84c9c9d585d7c4512983e4582cf6c3' }}
        working-directory: ./frontend/android
        run: ./gradlew assembleRelease bundleRelease --no-daemon --stacktrace

      - name: Build Android Debug APK (Fallback)
        if: ${{ secrets.ANDROID_KEYSTORE_BASE64 == '' }}
        working-directory: ./frontend/android
        run: ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Upload APK & AAB Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: kinjo-android-build
          path: |
            frontend/android/app/build/outputs/apk/release/*.apk
            frontend/android/app/build/outputs/apk/debug/*.apk
            frontend/android/app/build/outputs/bundle/release/*.aab
          retention-days: 30
