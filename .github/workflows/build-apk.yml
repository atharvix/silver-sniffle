name: Build Android APK

on:
  push:
    branches: [ main, master, slave ]
  pull_request:
    branches: [ main, master, slave ]
  workflow_dispatch:

jobs:
  build-apk:
    name: Build Android APK & AAB
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Java JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platforms;android-36 build-tools;35.0.0'

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install Frontend Dependencies
        working-directory: ./frontend
        run: npm install

      - name: Build Web Assets (Production)
        working-directory: ./frontend
        run: npm run build

      - name: Sync Capacitor Android
        working-directory: ./frontend
        run: npx cap sync android

      - name: Make Gradlew Executable
        working-directory: ./frontend/android
        run: chmod +x gradlew

      - name: Build Android Packages (Release APK, AAB or Debug)
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KINJO_KEYSTORE_FILE: kinjo-release-key.jks
          KINJO_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD || '0e84c9c9d585d7c4512983e4582cf6c3' }}
          KINJO_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS || 'kinjo-release-key' }}
          KINJO_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD || '0e84c9c9d585d7c4512983e4582cf6c3' }}
        working-directory: ./frontend/android
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "Decoding release keystore from secrets..."
            echo "$KEYSTORE_BASE64" | base64 --decode > app/kinjo-release-key.jks
            echo "Building Release APK & AAB..."
            ./gradlew assembleRelease bundleRelease --no-daemon --stacktrace
          elif [ -f "app/kinjo-release-key.jks" ]; then
            echo "Using existing repository keystore..."
            ./gradlew assembleRelease bundleRelease --no-daemon --stacktrace
          else
            echo "No keystore provided, building Debug APK fallback..."
            ./gradlew assembleDebug --no-daemon --stacktrace
          fi

      - name: Upload APK & AAB Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: kinjo-android-build
          path: |
            frontend/android/app/build/outputs/apk/release/*.apk
            frontend/android/app/build/outputs/apk/debug/*.apk
            frontend/android/app/build/outputs/bundle/release/*.aab
          retention-days: 30
