name: Send Custom Push Notification

on:
  push:
    branches: [ main, master, slave ]
  workflow_dispatch:
    inputs:
      target_email:
        description: 'Target User Email Address (Use * or all for entire database broadcast)'
        required: true
        type: string
        default: '*'
      title:
        description: 'Push Notification Title'
        required: true
        type: string
        default: 'System Announcement 🚀'
      body:
        description: 'Push Notification Message Body'
        required: true
        type: string
        default: 'This notification was triggered automated via GitHub Actions Workflow!'
      api_url:
        description: 'Backend API Endpoint Base URL'
        required: false
        type: string
        default: 'https://be81-14-194-0-162.ngrok-free.app/api'

jobs:
  send-push-notification:
    name: Dispatch Push Notification
    runs-on: ubuntu-latest

    steps:
      - name: Send Push Notification Payload via HTTP API
        run: |
          TARGET_EMAIL="${{ inputs.target_email }}"
          if [ -z "$TARGET_EMAIL" ]; then TARGET_EMAIL="*"; fi

          TITLE="${{ inputs.title }}"
          if [ -z "$TITLE" ]; then TITLE="System Announcement 🚀"; fi

          BODY="${{ inputs.body }}"
          if [ -z "$BODY" ]; then BODY="Automated notification payload dispatched via GitHub Actions!"; fi

          API_URL="${{ inputs.api_url }}"
          if [ -z "$API_URL" ]; then API_URL="https://be81-14-194-0-162.ngrok-free.app/api"; fi

          echo "Dispatching Push Notification to Target: $TARGET_EMAIL via $API_URL..."

          RESPONSE=$(curl -s -X POST "$API_URL/notifications/send-custom" \
            -H "Content-Type: application/json" \
            -H "ngrok-skip-browser-warning: true" \
            -d "{
              \"target_email\": \"$TARGET_EMAIL\",
              \"title\": \"$TITLE\",
              \"body\": \"$BODY\",
              \"data\": {
                \"source\": \"github_actions\",
                \"run_id\": \"$GITHUB_RUN_ID\"
              }
            }")

          echo "Response from Backend API:"
          echo "$RESPONSE"
