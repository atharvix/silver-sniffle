# Reference nginx config for kinjo.world. Diff against /etc/nginx/sites-available/kinjo
# before applying; then: nginx -t && systemctl reload nginx

# Rate limits. Signed-in API calls are limited per session, not per IP: a venue's
# Wi-Fi and mobile carriers (CGNAT) put hundreds or thousands of phones behind one
# IP. A phone posts its position every 5-30 s. The per-IP ceiling stops anyone
# dodging the session limit by inventing tokens.
map $http_authorization $kinjo_who { "" $binary_remote_addr; default $http_authorization; }
limit_req_zone $kinjo_who          zone=kinjo_user:32m  rate=5r/s;
limit_req_zone $binary_remote_addr zone=kinjo_ip:10m    rate=300r/s;
limit_req_zone $binary_remote_addr zone=kinjo_auth:10m  rate=10r/s;
limit_req_status 429;

# Photos are immutable per URL (?v= changes on every edit): serve repeats from nginx.
proxy_cache_path /var/cache/nginx/kinjo_photos levels=1:2 keys_zone=kinjo_photos:10m max_size=2g inactive=30d use_temp_path=off;

# $uri (no query string): tokens must never reach access logs.
log_format kinjo '$remote_addr [$time_local] "$request_method $uri" $status '
                 '$body_bytes_sent $request_time rid=$request_id';

upstream kinjo_api { server 127.0.0.1:8080; keepalive 32; }

server {
    listen 443 ssl http2;
    server_name kinjo.world;
    # ssl_certificate / ssl_certificate_key: keep your existing certbot lines.

    access_log /var/log/nginx/kinjo.access.log kinjo;
    root /var/www/kinjo-app/site;

    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Request-ID $request_id;   # same id in nginx and app logs

    location / { try_files $uri $uri/ /index.html; }

    location /api/ {
        limit_req zone=kinjo_user burst=20 nodelay;
        limit_req zone=kinjo_ip   burst=600 nodelay;
        proxy_set_header Connection ""; proxy_pass http://kinjo_api;
    }
    location /api/photo/ {
        limit_req zone=kinjo_ip burst=600 nodelay;   # public, no session: per-IP ceiling only
        proxy_cache kinjo_photos;
        proxy_cache_valid 200 30d;
        proxy_cache_key $uri$is_args$args;
        proxy_set_header Connection ""; proxy_pass http://kinjo_api;
    }
    # sign-in: per IP (no session yet); burst covers a room signing in at once
    location /auth/ { limit_req zone=kinjo_auth burst=60 nodelay; proxy_set_header Connection ""; proxy_pass http://kinjo_api; }
    location ~ ^/admin/(metrics|users|email|notify|ads) {
        limit_req zone=kinjo_auth burst=10 nodelay;   # also slows admin-token guessing
        proxy_set_header Connection ""; proxy_pass http://kinjo_api;
    }
    location = /ws {
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 75s;   # server pings every 54 s
        proxy_pass http://kinjo_api;
    }
    # Readiness for uptime monitors: 503 when the database is down.
    location = /healthz { access_log off; proxy_set_header Connection ""; proxy_pass http://kinjo_api; }
}
