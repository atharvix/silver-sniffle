# Reference nginx config for kinjo.world. Diff against /etc/nginx/sites-available/kinjo
# before applying; then: nginx -t && systemctl reload nginx

# Per-IP rate limits. Generous on purpose: Indian mobile carriers put many users
# behind one IP (CGNAT), and a phone posts its position at most every 2.5 s.
limit_req_zone $binary_remote_addr zone=kinjo_api:10m  rate=20r/s;
limit_req_zone $binary_remote_addr zone=kinjo_auth:10m rate=5r/s;
limit_req_status 429;

# $uri (no query string): tokens must never reach access logs.
log_format kinjo '$remote_addr [$time_local] "$request_method $uri" $status '
                 '$body_bytes_sent $request_time rid=$request_id';

upstream kinjo_api { server 127.0.0.1:8080; keepalive 32; }

server {
    listen 443 ssl http2;
    server_name kinjo.world;
    # ssl_certificate / ssl_certificate_key: keep your existing certbot lines.

    access_log /var/log/nginx/kinjo.access.log kinjo;
    root /var/www/kinjo-app/site;

    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Request-ID $request_id;   # same id in nginx and app logs

    location / { try_files $uri $uri/ /index.html; }

    location /api/  { limit_req zone=kinjo_api  burst=40 nodelay; proxy_set_header Connection ""; proxy_pass http://kinjo_api; }
    location /auth/ { limit_req zone=kinjo_auth burst=10 nodelay; proxy_set_header Connection ""; proxy_pass http://kinjo_api; }
    location ~ ^/admin/(metrics|users|email|notify|ads) {
        limit_req zone=kinjo_auth burst=10 nodelay;   # also slows admin-token guessing
        proxy_set_header Connection ""; proxy_pass http://kinjo_api;
    }
    location = /ws {
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 75s;   # server pings every 54 s
        proxy_pass http://kinjo_api;
    }
    # Readiness for uptime monitors: 503 when the database is down.
    location = /healthz { access_log off; proxy_set_header Connection ""; proxy_pass http://kinjo_api; }
}
