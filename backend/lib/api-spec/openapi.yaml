openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: API specification
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: auth
    description: Authentication operations
  - name: profiles
    description: User profile and location operations
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
  /auth/send-otp:
    post:
      operationId: sendOtp
      tags: [auth]
      summary: Send OTP to email address
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/OtpRequest"
      responses:
        "200":
          description: OTP sent successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OtpSendResult"
        "400":
          description: Invalid email address
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResult"
  /auth/send-welcome:
    post:
      operationId: sendWelcome
      tags: [auth]
      summary: Send onboarding welcome email after profile completion
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/WelcomeRequest"
      responses:
        "200":
          description: Welcome email sent
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WelcomeResult"
        "400":
          description: Invalid request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResult"
  /auth/verify-otp:
    post:
      operationId: verifyOtp
      tags: [auth]
      summary: Verify 4-digit OTP
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/OtpVerifyRequest"
      responses:
        "200":
          description: OTP verified — response includes a short-lived verification token
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OtpVerifyResult"
        "400":
          description: Invalid or expired OTP
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResult"
  /profiles:
    post:
      operationId: upsertProfile
      tags: [profiles]
      security:
        - verificationToken: []
      summary: Create or update a user profile
      description: >
        Creates or updates the caller's profile. Caller identity is derived
        server-side from the verification token issued by POST /auth/verify-otp.
        Pass the token as "Authorization: Bearer <token>".
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpsertProfileRequest"
      responses:
        "200":
          description: Profile saved
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProfileResult"
        "400":
          description: Invalid request body
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResult"
        "401":
          description: Missing or invalid verification token
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResult"
  /profiles/me:
    get:
      operationId: getMyProfile
      tags: [profiles]
      security:
        - verificationToken: []
      summary: Get the caller's own profile
      description: >
        Returns the caller's own saved profile (name, email, about, photo).
        Caller identity is derived server-side from the verification token.
        Used to detect a returning/logged-in user and to prefill profile
        editing.
      responses:
        "200":
          description: The caller's profile
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MyProfileResult"
        "401":
          description: Missing or invalid verification token
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResult"
        "404":
          description: Profile not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResult"
  /profiles/location:
    post:
      operationId: updateLocation
      tags: [profiles]
      security:
        - verificationToken: []
      summary: Update the caller's current location
      description: >
        Stores the caller's latest latitude/longitude and refreshes their
        "last seen" timestamp (equivalent to a heartbeat). Caller identity is
        derived server-side from the verification token. The profile must
        already exist.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateLocationRequest"
      responses:
        "200":
          description: Location updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LocationResult"
        "400":
          description: Invalid request body
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResult"
        "401":
          description: Missing or invalid verification token
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResult"
        "404":
          description: Profile not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResult"
  /profiles/heartbeat:
    post:
      operationId: sendHeartbeat
      tags: [profiles]
      security:
        - verificationToken: []
      summary: Signal that the caller is still actively present
      description: >
        Refreshes the caller's "last seen" timestamp so their profile keeps
        appearing in others' nearby results. The client should call this
        every few seconds while the discovery screen is open and visible.
        Callers who stop sending heartbeats (tab closed, backgrounded, or
        navigated away) age out of nearby results automatically.
      responses:
        "200":
          description: Heartbeat recorded
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HeartbeatResult"
        "401":
          description: Missing or invalid verification token
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResult"
        "404":
          description: Profile not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResult"
  /profiles/offline:
    post:
      operationId: goOffline
      tags: [profiles]
      summary: Immediately mark the caller as no longer present
      description: >
        Clears the caller's "last seen" timestamp so they disappear from
        nearby results right away, instead of waiting for their heartbeat to
        age out. Designed to be called from a `navigator.sendBeacon` on tab
        close/unload, so the token is passed in the JSON body rather than an
        Authorization header (sendBeacon cannot set custom headers).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/OfflineRequest"
      responses:
        "200":
          description: Marked offline
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HeartbeatResult"
        "401":
          description: Missing or invalid verification token
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResult"
  /profiles/nearby:
    get:
      operationId: getNearbyProfiles
      tags: [profiles]
      security:
        - verificationToken: []
      summary: Get profiles within ~30 metres of the caller
      description: >
        Returns profiles whose last known location is within 30 metres of the
        caller's stored location AND whose presence heartbeat is still fresh
        (sent within the last ~20 seconds). Profiles that have gone offline —
        tab closed, backgrounded, or heartbeat expired — are excluded, so
        results reflect who is actually present right now, not just who once
        shared a location. The caller is excluded from results. Each profile
        card includes a short AI-generated conversation-starter summary.
        Caller identity is derived server-side from the verification token.
      responses:
        "200":
          description: List of nearby, currently-present profiles
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NearbyProfilesResult"
        "400":
          description: Caller has no stored location, or their own heartbeat has expired
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResult"
        "401":
          description: Missing or invalid verification token
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResult"
        "404":
          description: Caller profile not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResult"
components:
  securitySchemes:
    verificationToken:
      type: http
      scheme: bearer
      description: >
        Short-lived opaque token issued by POST /auth/verify-otp.
        Valid for 30 minutes. Pass as "Authorization: Bearer <token>".
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status
    OtpRequest:
      type: object
      required: [email]
      properties:
        email:
          type: string
          description: Email address to send the OTP to
    OtpSendResult:
      type: object
      required: [success, message]
      properties:
        success:
          type: boolean
        message:
          type: string
        devOtp:
          type: ["string", "null"]
          description: OTP shown only in development mode
    OtpVerifyRequest:
      type: object
      required: [email, otp]
      properties:
        email:
          type: string
          description: Email address the OTP was sent to
        otp:
          type: string
          description: 4-digit OTP
    OtpVerifyResult:
      type: object
      required: [success, message, verificationToken]
      properties:
        success:
          type: boolean
        message:
          type: string
        verificationToken:
          type: string
          description: >
            Short-lived opaque token. Pass as "Authorization: Bearer <token>"
            on all profile endpoints. Valid for 30 minutes.
    WelcomeRequest:
      type: object
      required: [email, name]
      properties:
        email:
          type: string
          description: Verified email address of the new user
        name:
          type: string
          description: Display name chosen during profile setup
        about:
          type: string
          description: Optional bio text entered during profile setup
    WelcomeResult:
      type: object
      required: [success, message]
      properties:
        success:
          type: boolean
        message:
          type: string
    ErrorResult:
      type: object
      required: [error]
      properties:
        error:
          type: string
    UpsertProfileRequest:
      type: object
      required: [name]
      properties:
        name:
          type: string
          description: Display name
        about:
          type: string
          description: Short bio / about text
        photo:
          type: string
          description: Profile photo as a data URL
    ProfileResult:
      type: object
      required: [success, message]
      properties:
        success:
          type: boolean
        message:
          type: string
    UpdateLocationRequest:
      type: object
      required: [latitude, longitude]
      properties:
        latitude:
          type: number
          description: WGS-84 latitude in decimal degrees
        longitude:
          type: number
          description: WGS-84 longitude in decimal degrees
    LocationResult:
      type: object
      required: [success, message]
      properties:
        success:
          type: boolean
        message:
          type: string
    HeartbeatResult:
      type: object
      required: [success]
      properties:
        success:
          type: boolean
    OfflineRequest:
      type: object
      required: [token]
      properties:
        token:
          type: string
          description: Verification token identifying the caller (sendBeacon cannot set an Authorization header)
    MyProfileResult:
      type: object
      required: [email, name, about, photo]
      properties:
        email:
          type: string
        name:
          type: string
        about:
          type: string
        photo:
          type: string
          description: Profile photo as a data URL, or empty string if none set
    NearbyProfileCard:
      type: object
      required: [name, photo, distanceMeters, headline, conversationStarter]
      properties:
        name:
          type: string
        photo:
          type: string
          description: Profile photo data URL
        distanceMeters:
          type: number
          description: Great-circle distance from the requester in metres
        headline:
          type: string
          description: Short AI-generated identity headline (e.g. "Product designer building AI tools") based on the person's bio, meant to be the most prominent text on their card
        conversationStarter:
          type: string
          description: Short AI-generated conversation-starter line based on the person's bio
    NearbyProfilesResult:
      type: object
      required: [profiles]
      properties:
        profiles:
          type: array
          items:
            $ref: "#/components/schemas/NearbyProfileCard"
