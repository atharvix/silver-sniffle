kind = "web"
previewPath = "/"
title = "Series Landing Page"
version = "1.0.0"
id = "artifacts/series-landing"
router = "path"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 21732

[services.development]
run = "pnpm --filter @workspace/series-landing run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/series-landing", "run", "build" ]
serve = "static"
publicDir = "artifacts/series-landing/dist/public"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "21732"
BASE_PATH = "/"
