<div style="max-width:340px;margin:0 auto;">
  <h2 class="sr-only">A Series profile card styled like an iMessage shared-card preview, showing Aditi Rao's photo, intent, and a conversation-starting quote</h2>

  <div style="background:var(--surface-1);border-radius:24px;padding:1.25rem 1.25rem 0.75rem;">

    <div style="position:relative;height:290px;">

      <div style="position:absolute;top:14px;left:22px;right:-6px;height:250px;background:var(--surface-2);border:0.5px solid var(--border);border-radius:18px;transform:rotate(4deg);"></div>
      <div style="position:absolute;top:8px;left:12px;right:2px;height:255px;background:var(--surface-2);border:0.5px solid var(--border);border-radius:18px;transform:rotate(-3deg);"></div>

      <div style="position:absolute;top:0;left:0;width:250px;height:270px;border-radius:18px;overflow:hidden;border:0.5px solid var(--border-strong);background:linear-gradient(160deg, var(--c-teal-200,#5DCAA5) 0%, var(--c-teal-400,#1D9E75) 55%, var(--c-teal-600,#0F6E56) 100%);">

        <div style="position:absolute;top:10px;left:10px;right:10px;display:flex;align-items:center;justify-content:space-between;">
          <div style="display:flex;align-items:center;gap:6px;background:rgba(0,0,0,0.28);border-radius:999px;padding:4px 10px 4px 4px;">
            <div style="width:22px;height:22px;border-radius:50%;background:rgba(255,255,255,0.9);display:flex;align-items:center;justify-content:center;font-size:10px;font-weight:500;color:#0F6E56;">AR</div>
            <span style="font-size:12px;color:#fff;font-weight:500;">Aditi nearby</span>
          </div>
          <div style="display:flex;align-items:center;gap:4px;background:rgba(0,0,0,0.28);border-radius:999px;padding:4px 9px;">
            <i class="ti ti-eye" style="font-size:12px;color:#fff;" aria-hidden="true"></i>
            <span style="font-size:11px;color:#fff;">1 view</span>
          </div>
        </div>

        <div style="position:absolute;left:10px;right:10px;bottom:10px;">
          <span style="display:inline-flex;align-items:center;gap:5px;background:rgba(0,0,0,0.32);color:#fff;font-size:11px;font-weight:500;padding:4px 9px;border-radius:999px;margin-bottom:8px;">
            <i class="ti ti-users-plus" style="font-size:12px;" aria-hidden="true"></i>
            Looking for collaborators
          </span>
          <p style="font-size:14px;line-height:1.4;color:#fff;margin:0 0 6px;font-weight:500;">
            "Ask me about pricing experiments that 3x'd conversion"
          </p>
          <div style="display:flex;align-items:center;gap:5px;">
            <i class="ti ti-map-pin" style="font-size:11px;color:rgba(255,255,255,0.85);" aria-hidden="true"></i>
            <span style="font-size:11px;color:rgba(255,255,255,0.85);">TechCrunch Disrupt · just now</span>
          </div>
        </div>

      </div>
    </div>

    <div style="display:flex;align-items:center;gap:8px;background:var(--surface-2);border:0.5px solid var(--border);border-radius:20px;padding:8px 14px;margin-top:14px;">
      <i class="ti ti-plus" style="font-size:18px;color:var(--text-muted);" aria-hidden="true"></i>
      <span style="font-size:14px;color:var(--text-muted);flex:1;">iMessage</span>
      <i class="ti ti-microphone" style="font-size:18px;color:var(--text-muted);" aria-hidden="true"></i>
    </div>

  </div>
</div>
