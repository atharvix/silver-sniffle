<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Series – Create your profile</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
html, body {
  width: 100%;
  min-height: 100vh;
  font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
  background: #06232a;
  color: #fff;
  overflow-x: hidden;
}
a { text-decoration: none; color: inherit; }
.page {
  position: relative;
  width: 100%;
  min-height: 100vh;
  display: flex;
  flex-direction: column;
}
.page-bg {
  position: fixed;
  inset: 0;
  background:
    radial-gradient(ellipse 60% 75% at 50% 30%, rgba(45,180,200,0.38) 0%, transparent 64%),
    linear-gradient(160deg, #0c3a44 0%, #0a2e37 40%, #071f26 72%, #06232a 100%);
  z-index: 0;
}
/* NAVBAR */
.navbar {
  position: relative;
  z-index: 10;
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 20px 52px;
  width: 100%;
}
.nav-logo {
  font-size: 26px;
  font-weight: 900;
  letter-spacing: -1px;
  color: #fff;
  cursor: pointer;
}
.nav-logo span { font-weight: 200; }
.nav-step {
  font-size: 14px;
  font-weight: 500;
  color: rgba(255,255,255,0.6);
  letter-spacing: 0.02em;
}
/* CONTENT */
.content {
  position: relative;
  z-index: 5;
  flex: 1;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 20px 24px 60px;
}
.card {
  width: 100%;
  max-width: 560px;
  background: rgba(255,255,255,0.04);
  border: 1px solid rgba(255,255,255,0.1);
  border-radius: 22px;
  padding: 44px 44px 40px;
  box-shadow: 0 24px 70px rgba(0,0,0,0.45);
  backdrop-filter: blur(6px);
}
.card-title {
  font-size: clamp(30px, 4vw, 40px);
  font-weight: 900;
  letter-spacing: -1.4px;
  line-height: 1.05;
  margin-bottom: 8px;
}
.card-sub {
  font-size: 15px;
  color: rgba(255,255,255,0.62);
  line-height: 1.5;
  margin-bottom: 32px;
}
/* PHOTO */
.photo-row {
  display: flex;
  align-items: center;
  gap: 20px;
  margin-bottom: 30px;
}
.photo-upload {
  width: 96px;
  height: 96px;
  border-radius: 50%;
  background: rgba(255,255,255,0.06);
  border: 2px dashed rgba(255,255,255,0.28);
  display: flex;
  align-items: center;
  justify-content: center;
  cursor: pointer;
  flex-shrink: 0;
  overflow: hidden;
  position: relative;
  transition: border-color 0.2s ease, background 0.2s ease;
}
.photo-upload:hover {
  border-color: rgba(45,180,200,0.9);
  background: rgba(255,255,255,0.09);
}
.photo-upload svg { width: 30px; height: 30px; fill: rgba(255,255,255,0.55); }
.photo-upload img {
  position: absolute;
  inset: 0;
  width: 100%;
  height: 100%;
  object-fit: cover;
}
.photo-info .photo-label {
  font-size: 15px;
  font-weight: 600;
  margin-bottom: 4px;
}
.photo-info .photo-hint {
  font-size: 13px;
  color: rgba(255,255,255,0.5);
}
/* FIELDS */
.field { margin-bottom: 22px; }
.field label {
  display: block;
  font-size: 13px;
  font-weight: 600;
  letter-spacing: 0.04em;
  text-transform: uppercase;
  color: rgba(255,255,255,0.65);
  margin-bottom: 9px;
}
.field input,
.field textarea {
  width: 100%;
  background: rgba(255,255,255,0.06);
  border: 1px solid rgba(255,255,255,0.14);
  border-radius: 12px;
  padding: 14px 16px;
  font-size: 15px;
  font-family: inherit;
  color: #fff;
  transition: border-color 0.2s ease, background 0.2s ease;
}
.field input::placeholder,
.field textarea::placeholder { color: rgba(255,255,255,0.38); }
.field input:focus,
.field textarea:focus {
  outline: none;
  border-color: rgba(45,180,200,0.9);
  background: rgba(255,255,255,0.09);
}
.field textarea { resize: none; min-height: 84px; line-height: 1.5; }
/* SUBMIT */
.submit-pill {
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 12px;
  width: 100%;
  background: #fff;
  border: none;
  border-radius: 14px;
  padding: 16px 32px;
  cursor: pointer;
  box-shadow: 0 4px 28px rgba(0,0,0,0.4);
  margin-top: 8px;
  transition: transform 0.15s ease;
}
.submit-pill:hover { transform: translateY(-2px); }
.submit-dot {
  width: 28px;
  height: 28px;
  background: #30d158;
  border-radius: 50%;
  display: flex;
  align-items: center;
  justify-content: center;
  flex-shrink: 0;
}
.submit-dot svg { width: 16px; height: 16px; fill: #fff; }
.submit-text {
  font-size: 19px;
  font-weight: 700;
  color: #111;
  letter-spacing: -0.4px;
}
@media (max-width: 560px) {
  .navbar { padding: 18px 24px; }
  .card { padding: 32px 24px 30px; border-radius: 18px; }
  .photo-row { gap: 16px; }
}
</style>
</head>
<body>
<div class="page">
  <div class="page-bg"></div>
  <nav class="navbar">
    <div class="nav-logo">series<span>_</span></div>
    <div class="nav-step">Step 1 of 2</div>
  </nav>
  <div class="content">
    <div class="card">
      <div class="card-title">Create your profile</div>
      <div class="card-sub">This is what people nearby will see. Keep it real and keep it short.</div>

      <div class="photo-row">
        <label class="photo-upload" for="photo-input">
          <svg viewBox="0 0 24 24"><path d="M12 12.5a3.5 3.5 0 100-7 3.5 3.5 0 000 7zm0 1.8c-2.7 0-8 1.35-8 4V20h16v-1.7c0-2.65-5.3-4-8-4zM4 8h2.5l1.2-1.6h2.6V5H7.2L6 6.6H4V8z" opacity="0"/><path d="M12 15.2a4 4 0 100-8 4 4 0 000 8zm0-1.8a2.2 2.2 0 110-4.4 2.2 2.2 0 010 4.4zM9 2l-1.8 2H4a2 2 0 00-2 2v12a2 2 0 002 2h16a2 2 0 002-2V6a2 2 0 00-2-2h-3.2L15 2H9z"/></svg>
          <img id="photo-preview" alt="" style="display:none;">
        </label>
        <input type="file" id="photo-input" accept="image/*" hidden>
        <div class="photo-info">
          <div class="photo-label">Add a photo</div>
          <div class="photo-hint">A clear shot of your face works best.</div>
        </div>
      </div>

      <div class="field">
        <label for="name">Name</label>
        <input type="text" id="name" placeholder="Palashi Singhal">
      </div>

      <div class="field">
        <label for="doing">What you do</label>
        <input type="text" id="doing" placeholder="Seed-round startup founder">
      </div>

      <div class="field">
        <label for="looking">What you're looking for</label>
        <textarea id="looking" placeholder="Looking to meet some cool, like-minded people :)"></textarea>
      </div>

      <button class="submit-pill">
        <span class="submit-dot">
          <svg viewBox="0 0 24 24"><path d="M20 2H4c-1.1 0-2 .9-2 2v18l4-4h14c1.1 0 2-.9 2-2V4c0-1.1-.9-2-2-2z"/></svg>
        </span>
        <span class="submit-text">Continue</span>
      </button>
    </div>
  </div>
</div>
<script>
  const input = document.getElementById('photo-input');
  const preview = document.getElementById('photo-preview');
  const icon = document.querySelector('.photo-upload svg');
  input.addEventListener('change', e => {
    const file = e.target.files[0];
    if (!file) return;
    const url = URL.createObjectURL(file);
    preview.src = url;
    preview.style.display = 'block';
    if (icon) icon.style.display = 'none';
  });
</script>
</body>
</html>
