# Put these inside the existing `server { server_name kinjo.world; ... }` block (HTTPS),
# replacing the old backend's /api/ and /ws locations. The website keeps serving everything else.

location /api/ {
    proxy_pass http://127.0.0.1:8001;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    client_max_body_size 5m;          # profile photo upload
}

location = /ws {
    proxy_pass http://127.0.0.1:8001;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_set_header Host $host;
    proxy_read_timeout 300s;          # still phones report once a minute
    proxy_send_timeout 300s;
}

location = /healthz {
    proxy_pass http://127.0.0.1:8001;
}
